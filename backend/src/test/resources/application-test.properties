spring.application.name=backend-test

### Liquibase (DDL + test seed)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/liquibase/test-db-changelog.xml

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

### JWT (tests)
jwt.secret=test-jwt-secret-key-at-least-32-characters-long
jwt.expiration-ms=86400000

### File storage (tests)
aims.storage.base-path=${java.io.tmpdir}/aims-test-storage
