spring.application.name=backend

### Database (JPA)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aims}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

### Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/liquibase/db-changelog.xml

### JWT
jwt.secret=${JWT_SECRET:aims-dev-jwt-secret-key-at-least-32-characters-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

### Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=aims-backend
