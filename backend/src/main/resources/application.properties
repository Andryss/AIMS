spring.application.name=backend
spring.profiles.default=dev

### Database (JPA)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aims}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

### Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/liquibase/db-changelog.xml

### JWT (set JWT_SECRET in production; defaults live in application-dev.properties)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

### Demo data (enabled in application-dev.properties)
aims.demo-data.enabled=false

### File storage
aims.storage.base-path=${AIMS_STORAGE_BASE_PATH:${user.home}/.aims/storage}
spring.servlet.multipart.max-file-size=7MB
spring.servlet.multipart.max-request-size=10MB

### Db-queue
db-queue.processing-enabled=true
db-queue.shard-id=queue-shard-id
db-queue.table-name=queue_tasks

### Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=aims-backend
