openapi: 3.0.3
info:
  title: AIMS API
  description: API for AIMS backend
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: auth
    description: Authentication API
  - name: files
    description: File upload and download API
  - name: notifications
    description: Notifications API
  - name: incidents
    description: Incidents API

paths:
  /api/v1/auth/signin:
    post:
      summary: Sign in with login and password
      operationId: signIn
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        200:
          description: Signed in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        401:
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

  /api/v1/auth/me:
    get:
      summary: Get current authenticated user profile
      operationId: getAuthMe
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        200:
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

  /api/v1/files:
    post:
      summary: Upload a file
      operationId: uploadFile
      tags:
        - files
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResponse"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

  /api/v1/files/{id}:
    get:
      summary: Download file content by id
      operationId: downloadFile
      tags:
        - files
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        404:
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

  /api/v1/notifications:
    get:
      summary: List notifications for current user
      operationId: listNotifications
      tags:
        - notifications
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
      responses:
        200:
          description: Paginated notification list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

  /api/v1/notifications/unread-count:
    get:
      summary: Get unread notifications count
      operationId: getUnreadNotificationsCount
      tags:
        - notifications
      security:
        - bearerAuth: []
      responses:
        200:
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

  /api/v1/notifications/{id}/read:
    patch:
      summary: Mark notification as read
      operationId: markNotificationRead
      tags:
        - notifications
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Notification marked as read
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        404:
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

  /api/v1/incidents:
    get:
      summary: List incidents
      operationId: listIncidents
      tags:
        - incidents
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
      responses:
        200:
          description: Paginated incident list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentListResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
    post:
      summary: Create incident
      operationId: createIncident
      tags:
        - incidents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        200:
          description: Incident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

  /api/v1/incidents/{id}:
    get:
      summary: Get incident by id
      operationId: getIncident
      tags:
        - incidents
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        404:
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

  /api/v1/incidents/{id}/status:
    post:
      summary: Change incident status
      operationId: changeIncidentStatus
      tags:
        - incidents
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeIncidentStatusRequest"
      responses:
        200:
          description: Incident status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        404:
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Login:
      type: string
      description: User login
      minLength: 1
      maxLength: 100
      example: "operator"

    Password:
      type: string
      description: User password
      minLength: 1
      maxLength: 200
      example: "operator"

    AccessToken:
      type: string
      description: JWT access token (Bearer)
      example: "eyJhbGciOiJIUzI1NiJ9..."

    RoleName:
      type: string
      description: Role name
      example: "OPERATOR"

    PermissionCode:
      type: string
      description: Permission code
      example: "INCIDENT_READ"

    SignInRequest:
      description: Request body for sign in
      type: object
      required:
        - login
        - password
      properties:
        login:
          $ref: "#/components/schemas/Login"
        password:
          $ref: "#/components/schemas/Password"

    SignInResponse:
      description: Response after successful sign in
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          $ref: "#/components/schemas/AccessToken"

    AuthMeResponse:
      description: Current authenticated user profile
      type: object
      required:
        - login
        - roles
        - permissions
      properties:
        login:
          $ref: "#/components/schemas/Login"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleName"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCode"

    NotificationItem:
      description: Notification for current user
      type: object
      required:
        - id
        - message
        - relatedEntities
        - read
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        message:
          type: string
        relatedEntities:
          type: array
          items:
            type: string
          description: Entity references, e.g. INCIDENT:612
        read:
          type: boolean
          description: Whether notification was read
        readAt:
          type: string
          format: date-time
          description: Read timestamp (UTC), if read
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC)

    NotificationListResponse:
      description: Paginated notifications
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    UnreadCountResponse:
      description: Unread notifications count
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int64

    FileUploadResponse:
      description: Metadata of uploaded file
      type: object
      required:
        - id
        - fileName
        - contentType
        - fileSize
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: Numeric file identifier
        fileName:
          type: string
          description: Original file name
        contentType:
          type: string
          description: MIME type
        fileSize:
          type: integer
          format: int64
          description: Size in bytes
        createdAt:
          type: string
          format: date-time
          description: Upload timestamp (UTC)

    IncidentStatusApi:
      type: string
      enum:
        - DRAFT
        - READY_FOR_ANALYSIS

    IncidentEventTypeApi:
      type: string
      enum:
        - UNIDENTIFIED_SIGHTING
        - CONTACT_SUSPECT
        - ILLEGAL_UFO_LANDING
        - MEMORY_ANOMALY
        - ALIEN_ARTIFACT
        - ALIEN_CAPTURE

    CreateIncidentRequest:
      type: object
      required:
        - eventType
        - location
        - detectedAt
        - description
        - attachmentFileIds
      properties:
        eventType:
          $ref: "#/components/schemas/IncidentEventTypeApi"
        location:
          type: string
          minLength: 1
        detectedAt:
          type: string
          format: date-time
        description:
          type: string
          minLength: 1
        attachmentFileIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64

    ChangeIncidentStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/IncidentStatusApi"

    IncidentResponse:
      type: object
      required:
        - id
        - status
        - eventType
        - location
        - detectedAt
        - description
        - attachmentFileIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/IncidentStatusApi"
        eventType:
          $ref: "#/components/schemas/IncidentEventTypeApi"
        location:
          type: string
        detectedAt:
          type: string
          format: date-time
        description:
          type: string
        attachmentFileIds:
          type: array
          items:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    IncidentListResponse:
      description: Paginated incidents
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncidentResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    ErrorObject:
      description: Error response object
      type: object
      properties:
        code:
          description: Numeric error code
          type: integer
          format: int32
        message:
          description: Unique text identifier of the error
          type: string
        humanMessage:
          description: Human-readable error description
          type: string
