  /api/v1/incidents/{id}/cleanup-status:
    post:
      summary: Change cleanup status for incident
      operationId: changeIncidentCleanupStatus
      tags:
        - incidents
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeCleanupStatusRequest"
      responses:
        200:
          description: Incident with updated cleanup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        404:
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

  /api/v1/integration/monitoring/events:
    post:
      summary: Ingest monitoring event from external system
      operationId: ingestMonitoringEvent
      tags:
        - integration
      security:
        - integrationApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestMonitoringEventRequest"
      responses:
        201:
          description: Monitoring alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringAlertResponse"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        409:
          description: Duplicate external event id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

  /api/v1/monitoring/alerts:
    get:
      summary: List monitoring alerts
      operationId: listMonitoringAlerts
      tags:
        - monitoring
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MonitoringAlertStatusApi"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
      responses:
        200:
          description: Paginated monitoring alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringAlertListResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

  /api/v1/monitoring/alerts/{id}:
    get:
      summary: Get monitoring alert by id
      operationId: getMonitoringAlert
      tags:
        - monitoring
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Monitoring alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringAlertResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        404:
          description: Monitoring alert not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorObject"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    integrationApiKey:
      type: apiKey
      in: header
      name: X-Integration-Api-Key

  schemas:
    Login:
      type: string
      description: User login
      minLength: 1
      maxLength: 100
      example: "operator"

    Password:
      type: string
      description: User password
      minLength: 1
      maxLength: 200
      example: "operator"

    AccessToken:
      type: string
      description: JWT access token (Bearer)
      example: "eyJhbGciOiJIUzI1NiJ9..."

    RoleName:
      type: string
      description: Role name
      example: "OPERATOR"

    PermissionCode:
      type: string
      description: Permission code
      example: "INCIDENT_READ"

    SignInRequest:
      description: Request body for sign in
      type: object
      required:
        - login
        - password
      properties:
        login:
          $ref: "#/components/schemas/Login"
        password:
          $ref: "#/components/schemas/Password"

    SignInResponse:
      description: Response after successful sign in
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          $ref: "#/components/schemas/AccessToken"

    AuthMeResponse:
      description: Current authenticated user profile
      type: object
      required:
        - userId
        - login
        - roles
        - permissions
      properties:
        userId:
          type: integer
          format: int64
        login:
          $ref: "#/components/schemas/Login"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleName"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCode"

    NotificationItem:
      description: Notification for current user
      type: object
      required:
        - id
        - message
        - relatedEntities
        - read
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        message:
          type: string
        relatedEntities:
          type: array
          items:
            type: string
          description: Entity references, e.g. INCIDENT:612
        read:
          type: boolean
          description: Whether notification was read
        readAt:
          type: string
          format: date-time
          description: Read timestamp (UTC), if read
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC)

    NotificationListResponse:
      description: Paginated notifications
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    UnreadCountResponse:
      description: Unread notifications count
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int64

    FileUploadResponse:
      description: Metadata of uploaded file
      type: object
      required:
        - id
        - fileName
        - contentType
        - fileSize
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: Numeric file identifier
        fileName:
          type: string
          description: Original file name
        contentType:
          type: string
          description: MIME type
        fileSize:
          type: integer
          format: int64
          description: Size in bytes
        createdAt:
          type: string
          format: date-time
          description: Upload timestamp (UTC)

    IncidentStatusApi:
      type: string
      enum:
        - DRAFT
        - READY_FOR_ANALYSIS
        - READY_FOR_EXECUTION
        - CLARIFICATION_REQUIRED
        - PREPARATION_FOR_EXECUTION
        - PREPARED_FOR_EXECUTION
        - EXECUTING
        - EXECUTION_COMPLETED
        - REANALYSIS_REQUIRED

    CleanupStatusApi:
      type: string
      enum:
        - PREPARATION
        - EXECUTION
        - COMPLETED

    UserSummary:
      type: object
      required:
        - id
        - login
      properties:
        id:
          type: integer
          format: int64
        login:
          $ref: "#/components/schemas/Login"

    UserSearchResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"

    BatchUsersRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          maxItems: 100
          items:
            type: integer
            format: int64

    BatchUsersResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"

    SetIncidentResponsibleRequest:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          nullable: true

    SetIncidentExecutorsRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          items:
            type: integer
            format: int64

    AlienResponse:
      type: object
      required:
        - id
        - name
        - description
        - threatLevel
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        threatLevel:
          type: integer
          format: int32
          minimum: 1
          maximum: 10

    AlienSearchResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlienResponse"

    LinkIncidentAlienRequest:
      type: object
      required:
        - alienId
      properties:
        alienId:
          type: integer
          format: int64

    IncidentEventTypeApi:
      type: string
      enum:
        - UNIDENTIFIED_SIGHTING
        - CONTACT_SUSPECT
        - ILLEGAL_UFO_LANDING
        - MEMORY_ANOMALY
        - ALIEN_ARTIFACT
        - ALIEN_CAPTURE

    CreateIncidentRequest:
      type: object
      required:
        - eventType
        - location
        - detectedAt
        - description
        - attachmentFileIds
      properties:
        eventType:
          $ref: "#/components/schemas/IncidentEventTypeApi"
        location:
          type: string
          minLength: 1
        detectedAt:
          type: string
          format: date-time
        description:
          type: string
          minLength: 1
        attachmentFileIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        monitoringAlertId:
          type: integer
          format: int64
          description: Optional link to inbound monitoring alert

    ChangeIncidentStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/IncidentStatusApi"
        comment:
          type: string
          minLength: 1
          maxLength: 4000
          description: Optional comment saved together with status change

    ChangeCleanupStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/CleanupStatusApi"

    CreateCleanupReportRequest:
      type: object
      required:
        - description
        - attachmentFileIds
      properties:
        description:
          type: string
          minLength: 1
        attachmentFileIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64

    CleanupReportResponse:
      type: object
      required:
        - id
        - incidentId
        - description
        - attachmentFileIds
        - createdByUserId
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        incidentId:
          type: integer
          format: int64
        description:
          type: string
        attachmentFileIds:
          type: array
          items:
            type: integer
            format: int64
        createdByUserId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    CreateIncidentCommentRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000

    IncidentCommentResponse:
      type: object
      required:
        - id
        - incidentId
        - authorUserId
        - text
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        incidentId:
          type: integer
          format: int64
        authorUserId:
          type: integer
          format: int64
        text:
          type: string
        createdAt:
          type: string
          format: date-time

    IncidentCommentListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncidentCommentResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    IncidentHistorySnapshot:
      type: object
      description: Parsed JSON snapshot of incident state at change time
      required:
        - status
        - eventType
        - location
        - detectedAt
        - description
        - attachmentFileIds
        - executorUserIds
      properties:
        status:
          $ref: "#/components/schemas/IncidentStatusApi"
        eventType:
          $ref: "#/components/schemas/IncidentEventTypeApi"
        location:
          type: string
        detectedAt:
          type: string
          format: date-time
        description:
          type: string
        attachmentFileIds:
          type: array
          items:
            type: integer
            format: int64
        alienId:
          type: integer
          format: int64
          nullable: true
        responsibleUserId:
          type: integer
          format: int64
          nullable: true
        executorUserIds:
          type: array
          items:
            type: integer
            format: int64
        cleanupStatus:
          $ref: "#/components/schemas/CleanupStatusApi"
          nullable: true
        cleanupReportId:
          type: integer
          format: int64
          nullable: true

    IncidentHistoryEntry:
      type: object
      required:
        - id
        - changedAt
        - changedByUserId
        - snapshot
      properties:
        id:
          type: integer
          format: int64
        changedAt:
          type: string
          format: date-time
        changedByUserId:
          type: integer
          format: int64
        snapshot:
          $ref: "#/components/schemas/IncidentHistorySnapshot"

    IncidentHistoryListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncidentHistoryEntry"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    IncidentResponse:
      type: object
      required:
        - id
        - status
        - eventType
        - location
        - detectedAt
        - description
        - attachmentFileIds
        - executorUserIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/IncidentStatusApi"
        eventType:
          $ref: "#/components/schemas/IncidentEventTypeApi"
        location:
          type: string
        detectedAt:
          type: string
          format: date-time
        description:
          type: string
        attachmentFileIds:
          type: array
          items:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        alienId:
          type: integer
          format: int64
        responsibleUserId:
          type: integer
          format: int64
          nullable: true
        executorUserIds:
          type: array
          items:
            type: integer
            format: int64
        cleanupStatus:
          $ref: "#/components/schemas/CleanupStatusApi"
          nullable: true
        cleanupReportId:
          type: integer
          format: int64
          nullable: true
        monitoringAlertId:
          type: integer
          format: int64
          nullable: true

    MonitoringAlertStatusApi:
      type: string
      enum:
        - NEW
        - INCIDENT_CREATED

    IngestMonitoringEventRequest:
      type: object
      required:
        - externalEventId
        - detectedAt
        - location
        - eventType
        - description
      properties:
        externalEventId:
          type: string
          minLength: 1
          maxLength: 200
        sourceSystem:
          type: string
          minLength: 1
          maxLength: 100
          default: EXTERNAL_MONITORING_V1
        detectedAt:
          type: string
          format: date-time
        location:
          type: string
          minLength: 1
        eventType:
          $ref: "#/components/schemas/IncidentEventTypeApi"
        description:
          type: string
          minLength: 1
        mediaUrls:
          type: array
          items:
            type: string
            format: uri

    MonitoringAlertResponse:
      type: object
      required:
        - id
        - externalEventId
        - sourceSystem
        - status
        - eventType
        - location
        - detectedAt
        - description
        - mediaUrls
        - receivedAt
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        externalEventId:
          type: string
        sourceSystem:
          type: string
        status:
          $ref: "#/components/schemas/MonitoringAlertStatusApi"
        eventType:
          $ref: "#/components/schemas/IncidentEventTypeApi"
        location:
          type: string
        detectedAt:
          type: string
          format: date-time
        description:
          type: string
        mediaUrls:
          type: array
          items:
            type: string
        incidentId:
          type: integer
          format: int64
          nullable: true
        receivedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    MonitoringAlertListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringAlertResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    IncidentListResponse:
      description: Paginated incidents
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncidentResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    ErrorObject:
      description: Error response object
      type: object
      properties:
        code:
          description: Numeric error code
          type: integer
          format: int32
        message:
          description: Unique text identifier of the error
          type: string
        humanMessage:
          description: Human-readable error description
          type: string
