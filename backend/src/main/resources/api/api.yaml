openapi: 3.0.3
info:
  title: AIMS API
  description: API for AIMS backend
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: auth
    description: Authentication API
  - name: files
    description: File upload and download API
  - name: notifications
    description: Notifications API
  - name: incident-statistics
    description: Historical incidents statistics API
  - name: incidents
    description: Incidents API
  - name: aliens
    description: Alien knowledge base API
  - name: equipment-statistics
    description: Historical equipment statistics API
  - name: equipment
    description: Equipment inventory API
  - name: equipment-movements
    description: Equipment movements API
  - name: detention-statistics
    description: Historical detention-requests statistics API
  - name: detention-requests
    description: Detention requests and custody API
  - name: users
    description: Users API
  - name: integration
    description: External system integration API
  - name: monitoring
    description: Monitoring alerts API

