pathItems:
  UsersSearch:
    get:
      summary: Search users by login
      operationId: searchUsers
      tags:
        - users
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: role
          in: query
          required: false
          schema:
            $ref: "./auth.yaml#/components/schemas/RoleName"
      responses:
        200:
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchResponse"
        400:
          $ref: ../common.yaml#/components/responses/BadRequest
        401:
          $ref: ../common.yaml#/components/responses/Unauthorized
        403:
          $ref: ../common.yaml#/components/responses/Forbidden
        500:
          $ref: ../common.yaml#/components/responses/InternalServerError

  UsersBatch:
    post:
      summary: Batch load users by ids
      operationId: batchUsers
      tags:
        - users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchUsersRequest"
      responses:
        200:
          description: Users found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUsersResponse"
        401:
          $ref: ../common.yaml#/components/responses/Unauthorized
        403:
          $ref: ../common.yaml#/components/responses/Forbidden
        500:
          $ref: ../common.yaml#/components/responses/InternalServerError

components:
  schemas:
    UserSummary:
      type: object
      required:
        - id
        - login
      properties:
        id:
          type: integer
          format: int64
        login:
          $ref: "./auth.yaml#/components/schemas/Login"

    UserSearchResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"

    BatchUsersRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          maxItems: 100
          items:
            type: integer
            format: int64

    BatchUsersResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
