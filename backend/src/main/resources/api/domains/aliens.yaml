paths:
  /api/v1/aliens:
    get:
      summary: List and search alien knowledge base
      operationId: listAliens
      tags: [aliens]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - $ref: "../common.yaml#/components/parameters/Page"
        - $ref: "../common.yaml#/components/parameters/Size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlienListResponse"
        400:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        401:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        403:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        404:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        500:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
    post:
      summary: Create alien knowledge base entry
      operationId: createAlien
      tags: [aliens]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAlienRequest"
      responses:
        201:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlienResponse"
        400:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        401:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        403:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        404:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        500:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"

  /api/v1/aliens/search:
    get:
      summary: Search aliens in knowledge base
      operationId: searchAliens
      tags:
        - aliens
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        200:
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlienSearchResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"

  /api/v1/aliens/{id}:
    get:
      summary: Get alien by id
      operationId: getAlien
      tags:
        - aliens
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Alien entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlienResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        404:
          description: Alien not found
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"

    put:
      summary: Update alien knowledge base entry
      operationId: updateAlien
      tags: [aliens]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAlienRequest"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlienResponse"
        400:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        401:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        403:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        404:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        500:
          description: Error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"

components:
  schemas:
    SaveAlienRequest:
      type: object
      required: [name, description, threatLevel]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '(?s).*\S.*'
        description:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: '(?s).*\S.*'
        threatLevel:
          type: integer
          format: int32
          minimum: 1
          maximum: 10

    AlienListResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlienResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    AlienResponse:
      type: object
      required:
        - id
        - name
        - description
        - threatLevel
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        threatLevel:
          type: integer
          format: int32
          minimum: 1
          maximum: 10

    AlienSearchResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlienResponse"
