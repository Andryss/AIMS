pathItems:
  Equipment:
    get:
      operationId: listEquipment
      tags:
        - equipment
      security:
        - bearerAuth: []
      parameters:
        - name: "q"
          in: query
          required: false
          schema:
            type: string
        - name: "type"
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EquipmentTypeApi"
        - name: "status"
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EquipmentStatusApi"
        - name: "holderUserId"
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "../common.yaml#/components/parameters/Page"
        - $ref: "../common.yaml#/components/parameters/Size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentListResponse"
        400:
          $ref: ../common.yaml#/components/responses/BadRequest
        401:
          $ref: ../common.yaml#/components/responses/Unauthorized
        403:
          $ref: ../common.yaml#/components/responses/Forbidden
        404:
          $ref: ../common.yaml#/components/responses/NotFound
        409:
          $ref: ../common.yaml#/components/responses/Conflict
    post:
      operationId: createEquipment
      tags:
        - equipment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveEquipmentRequest"
      responses:
        201:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        400:
          $ref: ../common.yaml#/components/responses/BadRequest
        401:
          $ref: ../common.yaml#/components/responses/Unauthorized
        403:
          $ref: ../common.yaml#/components/responses/Forbidden
        404:
          $ref: ../common.yaml#/components/responses/NotFound
        409:
          $ref: ../common.yaml#/components/responses/Conflict

  EquipmentById:
    get:
      operationId: getEquipment
      tags:
        - equipment
      security:
        - bearerAuth: []
      parameters:
        - name: "id"
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        400:
          $ref: ../common.yaml#/components/responses/BadRequest
        401:
          $ref: ../common.yaml#/components/responses/Unauthorized
        403:
          $ref: ../common.yaml#/components/responses/Forbidden
        404:
          $ref: ../common.yaml#/components/responses/NotFound
        409:
          $ref: ../common.yaml#/components/responses/Conflict
    put:
      operationId: updateEquipment
      tags:
        - equipment
      security:
        - bearerAuth: []
      parameters:
        - name: "id"
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveEquipmentRequest"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentResponse"
        400:
          $ref: ../common.yaml#/components/responses/BadRequest
        401:
          $ref: ../common.yaml#/components/responses/Unauthorized
        403:
          $ref: ../common.yaml#/components/responses/Forbidden
        404:
          $ref: ../common.yaml#/components/responses/NotFound
        409:
          $ref: ../common.yaml#/components/responses/Conflict

  EquipmentByIdHistory:
    get:
      operationId: listEquipmentHistory
      tags:
        - equipment
      security:
        - bearerAuth: []
      parameters:
        - name: "id"
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "../common.yaml#/components/parameters/Page"
        - $ref: "../common.yaml#/components/parameters/Size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentHistoryListResponse"
        400:
          $ref: ../common.yaml#/components/responses/BadRequest
        401:
          $ref: ../common.yaml#/components/responses/Unauthorized
        403:
          $ref: ../common.yaml#/components/responses/Forbidden
        404:
          $ref: ../common.yaml#/components/responses/NotFound
        409:
          $ref: ../common.yaml#/components/responses/Conflict

components:
  schemas:
    EquipmentTypeApi:
      type: string
      enum:
        - NEURALYZER
        - NEUTRALIZER

    EquipmentStatusApi:
      type: string
      enum:
        - AVAILABLE
        - ISSUED

    EquipmentHistoryEventApi:
      type: string
      enum:
        - REGISTERED
        - RECEIVED
        - UPDATED
        - ISSUED
        - RETURNED

    SaveEquipmentRequest:
      type: object
      required:
        - type
        - model
        - serialNumber
      properties:
        type:
          $ref: "#/components/schemas/EquipmentTypeApi"
        model:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "(?s).*\\S.*"
        serialNumber:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "(?s).*\\S.*"

    EquipmentResponse:
      type: object
      required:
        - id
        - type
        - model
        - serialNumber
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        type:
          $ref: "#/components/schemas/EquipmentTypeApi"
        model:
          type: string
        serialNumber:
          type: string
        status:
          $ref: "#/components/schemas/EquipmentStatusApi"
        holderUserId:
          type: integer
          format: int64
          minimum: 1
        currentIssueMovementId:
          type: integer
          format: int64
          minimum: 1
        sourceTenderId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          readOnly: true
        createdAt:
          type: string
          format: date-time

    EquipmentListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    EquipmentHistorySnapshot:
      type: object
      required:
        - event
        - equipment
      properties:
        event:
          $ref: "#/components/schemas/EquipmentHistoryEventApi"
        movementId:
          type: integer
          format: int64
          minimum: 1
        equipment:
          $ref: "#/components/schemas/EquipmentResponse"

    EquipmentHistoryEntry:
      type: object
      required:
        - id
        - changedAt
        - changedByUserId
        - snapshot
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        changedAt:
          type: string
          format: date-time
        changedByUserId:
          type: integer
          format: int64
          minimum: 1
        snapshot:
          $ref: "#/components/schemas/EquipmentHistorySnapshot"

    EquipmentHistoryListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentHistoryEntry"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
