paths:
  /api/v1/monitoring/alerts:
    get:
      summary: List monitoring alerts
      operationId: listMonitoringAlerts
      tags:
        - monitoring
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MonitoringAlertStatusApi"
        - $ref: "../common.yaml#/components/parameters/Page"
        - $ref: "../common.yaml#/components/parameters/Size"
      responses:
        200:
          description: Paginated monitoring alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringAlertListResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"

  /api/v1/monitoring/alerts/{id}:
    get:
      summary: Get monitoring alert by id
      operationId: getMonitoringAlert
      tags:
        - monitoring
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Monitoring alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringAlertResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        404:
          description: Monitoring alert not found
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"

components:
  schemas:
    MonitoringAlertStatusApi:
      type: string
      enum:
        - NEW
        - INCIDENT_CREATED

    MonitoringAlertResponse:
      type: object
      required:
        - id
        - externalEventId
        - sourceSystem
        - status
        - eventType
        - location
        - detectedAt
        - description
        - mediaUrls
        - receivedAt
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        externalEventId:
          type: string
        sourceSystem:
          type: string
        status:
          $ref: "#/components/schemas/MonitoringAlertStatusApi"
        eventType:
          $ref: "./incidents.yaml#/components/schemas/IncidentEventTypeApi"
        location:
          type: string
        detectedAt:
          type: string
          format: date-time
        description:
          type: string
        mediaUrls:
          type: array
          items:
            type: string
        incidentId:
          type: integer
          format: int64
          nullable: true
        receivedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    MonitoringAlertListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringAlertResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
