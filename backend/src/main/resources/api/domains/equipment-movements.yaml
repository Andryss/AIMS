  /api/v1/equipment-movements/{id}/status:
    patch:
      operationId: changeEquipmentMovementStatus
      tags:
        - equipment-movements
      security:
        - bearerAuth: []
      parameters:
        - name: "id"
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEquipmentMovementStatusRequest"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
