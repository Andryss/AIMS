paths:
  /api/v1/equipment-movements:
    get:
      operationId: listEquipmentMovements
      tags:
        - equipment-movements
      security:
        - bearerAuth: []
      parameters:
        - name: "incidentId"
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: "responsibleUserId"
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: "status"
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EquipmentMovementStatusApi"
        - name: "operation"
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EquipmentMovementOperationApi"
        - name: "equipmentId"
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "../common.yaml#/components/parameters/Page"
        - $ref: "../common.yaml#/components/parameters/Size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentMovementListResponse"
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        409:
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
    post:
      operationId: createEquipmentMovement
      tags:
        - equipment-movements
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveEquipmentMovementRequest"
      responses:
        201:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentMovementResponse"
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
