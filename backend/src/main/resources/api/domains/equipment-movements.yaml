        404:
          description: Not found
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        409:
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"

