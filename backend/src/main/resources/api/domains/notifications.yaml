paths:
  /api/v1/notifications:
    get:
      summary: List notifications for current user
      operationId: listNotifications
      tags:
        - notifications
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../common.yaml#/components/parameters/Page"
        - $ref: "../common.yaml#/components/parameters/Size"
      responses:
        200:
          description: Paginated notification list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"

  /api/v1/notifications/unread-count:
    get:
      summary: Get unread notifications count
      operationId: getUnreadNotificationsCount
      tags:
        - notifications
      security:
        - bearerAuth: []
      responses:
        200:
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"

  /api/v1/notifications/{id}/read:
    patch:
      summary: Mark notification as read
      operationId: markNotificationRead
      tags:
        - notifications
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Notification marked as read
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        404:
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "../common.yaml#/components/schemas/ErrorObject"

components:
  schemas:
    NotificationItem:
      description: Notification for current user
      type: object
      required:
        - id
        - message
        - relatedEntities
        - read
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        message:
          type: string
        relatedEntities:
          type: array
          items:
            type: string
          description: Entity references, e.g. INCIDENT:612
        read:
          type: boolean
          description: Whether notification was read
        readAt:
          type: string
          format: date-time
          description: Read timestamp (UTC), if read
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC)

    NotificationListResponse:
      description: Paginated notifications
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    UnreadCountResponse:
      description: Unread notifications count
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int64
