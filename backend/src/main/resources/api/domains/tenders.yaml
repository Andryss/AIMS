pathItems:
  Tenders:
    get:
      operationId: listTenders
      tags:
        - tenders
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TenderStatusApi"
        - name: equipmentType
          in: query
          required: false
          schema:
            $ref: "./equipment.yaml#/components/schemas/EquipmentTypeApi"
        - name: incidentId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "../common.yaml#/components/parameters/Page"
        - $ref: "../common.yaml#/components/parameters/Size"
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderListResponse"
        400:
          $ref: ../common.yaml#/components/responses/BadRequest
        401:
          $ref: ../common.yaml#/components/responses/Unauthorized
        403:
          $ref: ../common.yaml#/components/responses/Forbidden
        404:
          $ref: ../common.yaml#/components/responses/NotFound
        409:
          $ref: ../common.yaml#/components/responses/Conflict
        500:
          $ref: ../common.yaml#/components/responses/InternalServerError
    post:
      operationId: createTender
      tags:
        - tenders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTenderRequest"
      responses:
        201:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderResponse"
        400:
          $ref: ../common.yaml#/components/responses/BadRequest
        401:
          $ref: ../common.yaml#/components/responses/Unauthorized
        403:
          $ref: ../common.yaml#/components/responses/Forbidden
        404:
