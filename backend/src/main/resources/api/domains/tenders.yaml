components:
  schemas:
    TenderStatusApi:
      type: string
      enum:
        [
          NEED,
          COLLECTING_OFFERS,
          AWAITING_DELIVERY,
          COMPLETED,
          CANCELLED
        ]

    TenderParticipantStatusApi:
      type: string
      enum: [ PARTICIPATING, WINNER ]

    SaveTenderRequest:
      type: object
      required:
        - equipmentType
        - quantity
      properties:
        equipmentType:
          $ref: "./equipment.yaml#/components/schemas/EquipmentTypeApi"
        quantity:
          type: integer
          format: int32
          minimum: 1
        conditions:
          type: string
          maxLength: 4000
        incidentId:
          type: integer
          format: int64
          minimum: 1

    TenderResponse:
      type: object
      required:
        - id
        - equipmentType
        - quantity
        - status
        - createdByUserId
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        equipmentType:
          $ref: "./equipment.yaml#/components/schemas/EquipmentTypeApi"
        quantity:
          type: integer
          format: int32
          minimum: 1
        conditions:
          type: string
          maxLength: 4000
        incidentId:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/TenderStatusApi"
        createdByUserId:
          type: integer
          format: int64
          minimum: 1
        winnerParticipantId:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    ChangeTenderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/TenderStatusApi"
        comment:
          type: string
          maxLength: 4000

    SelectTenderWinnerRequest:
      type: object
      required:
        - participantId
      properties:
        participantId:
          type: integer
          format: int64
          minimum: 1

    SaveTenderParticipantRequest:
      type: object
      required:
        - name
        - proposal
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "(?s).*\\S.*"
        proposal:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: "(?s).*\\S.*"

    TenderParticipantListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenderParticipantResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    TenderParticipantResponse:
      type: object
      required:
        - id
        - tenderId
        - createdByUserId
        - createdAt
        - updatedAt
        - name
        - proposal
        - status
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        tenderId:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        proposal:
          type: string
        status:
          $ref: "#/components/schemas/TenderParticipantStatusApi"
        createdByUserId:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReceiveTenderEquipmentRequest:
      type: object
      required:
        - model
        - serialNumber
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "(?s).*\\S.*"
        serialNumber:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "(?s).*\\S.*"

    ReceiveTenderRequest:
      type: object
      required:
        - equipment
      properties:
        equipment:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReceiveTenderEquipmentRequest"
        comment:
          type: string
          maxLength: 4000

    TenderReceiptResponse:
      type: object
      required:
        - tender
        - equipment
      properties:
        tender:
          $ref: "#/components/schemas/TenderResponse"
        equipment:
          type: array
          items:
            $ref: "./equipment.yaml#/components/schemas/EquipmentResponse"

    TenderHistorySnapshot:
      type: object
      required:
        - tender
        - participants
        - receivedEquipmentIds
      properties:
        tender:
          $ref: "#/components/schemas/TenderResponse"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/TenderParticipantResponse"
        transitionComment:
          type: string
        receivedEquipmentIds:
          type: array
          items:
            type: integer
            format: int64

    TenderHistoryEntry:
      type: object
      required:
        - id
        - changedAt
        - changedByUserId
        - snapshot
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        changedAt:
          type: string
          format: date-time
        changedByUserId:
          type: integer
          format: int64
          minimum: 1
        snapshot:
          $ref: "#/components/schemas/TenderHistorySnapshot"

    TenderListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenderResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    TenderHistoryListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenderHistoryEntry"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
