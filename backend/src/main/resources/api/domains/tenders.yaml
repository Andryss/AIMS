components:
  schemas:
    TenderStatusApi:
      type: string
      enum: [NEED, COLLECTING_OFFERS, AWAITING_DELIVERY, COMPLETED, CANCELLED]

    TenderParticipantStatusApi:
      type: string
      enum: [PARTICIPATING, WINNER]

    SaveTenderRequest:
      type: object
      required:
        - equipmentType
        - quantity
      properties:
        equipmentType:
          $ref: "./equipment.yaml#/components/schemas/EquipmentTypeApi"
        quantity:
          type: integer
          format: int32
          minimum: 1
        conditions:
          type: string
          maxLength: 4000
        incidentId:
          type: integer
          format: int64
          minimum: 1

    TenderResponse:
      type: object
      required:
        - id
        - equipmentType
        - quantity
        - status
        - createdByUserId
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        equipmentType:
          $ref: "./equipment.yaml#/components/schemas/EquipmentTypeApi"
        quantity:
          type: integer
          format: int32
          minimum: 1
        conditions:
          type: string
          maxLength: 4000
        incidentId:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: "#/components/schemas/TenderStatusApi"
        createdByUserId:
          type: integer
          format: int64
          minimum: 1
        winnerParticipantId:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    ChangeTenderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/TenderStatusApi"
        comment:
          type: string
          maxLength: 4000

    SaveTenderParticipantRequest:
      type: object
      required:
        - name
        - proposal
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "(?s).*\\S.*"
        proposal:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: "(?s).*\\S.*"

    TenderParticipantListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenderParticipantResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    TenderParticipantResponse:
      type: object
      required:
        - id
        - tenderId
        - createdByUserId
        - createdAt
        - updatedAt
        - name
        - proposal
        - status
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        tenderId:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        proposal:
          type: string
        status:
          $ref: "#/components/schemas/TenderParticipantStatusApi"
        createdByUserId:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TenderHistorySnapshot:
      type: object
      required:
        - tender
        - participants
        - receivedEquipmentIds
      properties:
        tender:
          $ref: "#/components/schemas/TenderResponse"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/TenderParticipantResponse"
        transitionComment:
          type: string
        receivedEquipmentIds:
          type: array
          items:
            type: integer
            format: int64

    TenderHistoryEntry:
      type: object
      required:
        - id
        - changedAt
        - changedByUserId
        - snapshot
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        changedAt:
          type: string
          format: date-time
        changedByUserId:
          type: integer
          format: int64
          minimum: 1
        snapshot:
          $ref: "#/components/schemas/TenderHistorySnapshot"

    TenderListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenderResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    TenderHistoryListResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TenderHistoryEntry"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
