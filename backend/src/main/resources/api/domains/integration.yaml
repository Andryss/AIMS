pathItems:
  IntegrationMonitoringEvents:
    post:
      summary: Ingest monitoring event from external system
      operationId: ingestMonitoringEvent
      tags:
        - integration
      security:
        - integrationApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestMonitoringEventRequest"
      responses:
        201:
          description: Monitoring alert created
          content:
            application/json:
              schema:
                $ref: "./monitoring.yaml#/components/schemas/MonitoringAlertResponse"
        400:
          $ref: ../common.yaml#/components/responses/BadRequest
        401:
          $ref: ../common.yaml#/components/responses/Unauthorized
        403:
          $ref: ../common.yaml#/components/responses/Forbidden
        409:
          $ref: ../common.yaml#/components/responses/Conflict
        500:
          $ref: ../common.yaml#/components/responses/InternalServerError

components:
  schemas:
    IngestMonitoringEventRequest:
      type: object
      required:
        - externalEventId
        - detectedAt
        - location
        - eventType
        - description
      properties:
        externalEventId:
          type: string
          minLength: 1
          maxLength: 200
        sourceSystem:
          type: string
          minLength: 1
          maxLength: 100
          default: EXTERNAL_MONITORING_V1
        detectedAt:
          type: string
          format: date-time
        location:
          type: string
          minLength: 1
        eventType:
          $ref: "./incidents.yaml#/components/schemas/IncidentEventTypeApi"
        description:
          type: string
          minLength: 1
        mediaUrls:
          type: array
          items:
            type: string
            format: uri
