pathItems:
  AuthSignin:
    post:
      summary: Sign in with login and password
      operationId: signIn
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        200:
          description: Signed in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponse"
        400:
          $ref: ../common.yaml#/components/responses/BadRequest
        401:
          $ref: ../common.yaml#/components/responses/Unauthorized
        500:
          $ref: ../common.yaml#/components/responses/InternalServerError

  AuthMe:
    get:
      summary: Get current authenticated user profile
      operationId: getAuthMe
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        200:
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        401:
          $ref: ../common.yaml#/components/responses/Unauthorized
        500:
          $ref: ../common.yaml#/components/responses/InternalServerError

components:
  schemas:
    Login:
      type: string
      description: User login
      minLength: 1
      maxLength: 100
      example: "operator"

    Password:
      type: string
      description: User password
      minLength: 1
      maxLength: 200
      example: "operator"

    AccessToken:
      type: string
      description: JWT access token (Bearer)
      example: "eyJhbGciOiJIUzI1NiJ9..."

    RoleName:
      type: string
      description: Role name
      example: "OPERATOR"

    PermissionCode:
      type: string
      description: Permission code
      example: "INCIDENT_READ"

    SignInRequest:
      description: Request body for sign in
      type: object
      required:
        - login
        - password
      properties:
        login:
          $ref: "#/components/schemas/Login"
        password:
          $ref: "#/components/schemas/Password"

    SignInResponse:
      description: Response after successful sign in
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          $ref: "#/components/schemas/AccessToken"

    AuthMeResponse:
      description: Current authenticated user profile
      type: object
      required:
        - userId
        - login
        - roles
        - permissions
      properties:
        userId:
          type: integer
          format: int64
        login:
          $ref: "#/components/schemas/Login"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleName"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCode"
