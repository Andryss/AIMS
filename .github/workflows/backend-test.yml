name: Backend Tests

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'

concurrency:
  group: backend-tests
  queue: max

jobs:
  db-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-test-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-test-

      - name: Run database tests
        run: ./mvnw -B -Pdb-tests test
        working-directory: backend

      - name: Restore Allure history
        id: allure-history
        if: success() || failure()
        uses: actions/cache/restore@v5
        with:
          path: backend/.allure/history/report/history
          key: backend-db-allure-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            backend-db-allure-history-${{ github.ref_name }}-

      - name: Generate Allure report
        id: allure-report
        if: success() || failure()
        run: ./mvnw -B -Pdb-tests allure:report
        working-directory: backend

      - name: Save Allure history
        if: (success() || failure()) && steps.allure-report.outcome == 'success' && steps.allure-history.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: backend/.allure/history/report/history
          key: ${{ steps.allure-history.outputs.cache-primary-key }}

      - name: Upload Allure report
        if: (success() || failure()) && steps.allure-report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: backend-db-allure-report-${{ github.run_attempt }}
          path: backend/target/custom-tests/db-test/report/
          if-no-files-found: error
