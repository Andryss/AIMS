name: Business Cycle Tests

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/e2e-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-e2e-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Allure CLI
        run: npm install --global allure-commandline@2.46.1

      - name: Restore Allure history
        id: allure-history
        uses: actions/cache/restore@v5
        with:
          path: backend/target/custom-tests/e2e-test/history
          key: backend-e2e-allure-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            backend-e2e-allure-history-${{ github.ref_name }}-

      - name: Run business-cycle tests and generate Allure report
        run: ./backend/src/test/e2e/run.sh

      - name: Save Allure history
        if: (success() || failure()) && steps.allure-history.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: backend/target/custom-tests/e2e-test/history
          key: ${{ steps.allure-history.outputs.cache-primary-key }}

      - name: Upload Allure report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-e2e-allure-report-${{ github.run_attempt }}
          path: backend/target/custom-tests/e2e-test/report/
          if-no-files-found: error
